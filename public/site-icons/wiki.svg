<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Shield base -->
  <path d="M32 4 L56 12 V30 C56 46 45 55 32 60 C19 55 8 46 8 30 V12 Z" fill="url(#bg)" stroke="url(#gold)" stroke-width="3.5"/>
  <!-- Crossed Staff (back-left to bottom-right) -->
  <line x1="18" y1="18" x2="46" y2="48" stroke="url(#blue)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="17" cy="17" r="5" fill="#38bdf8" stroke="#bae6fd" stroke-width="1.5"/>
  <!-- Crossed Sword (top-right to bottom-left) -->
  <line x1="47" y1="15" x2="19" y2="47" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <line x1="21" y1="37" x2="29" y2="45" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="17" cy="49" r="2.5" fill="url(#gold)"/>
</svg>
